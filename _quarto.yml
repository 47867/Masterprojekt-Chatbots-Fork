project:
  type: default
  render:
    - "*.qmd"
    - "!Python_code/"

manuscript:
  article: index.qmd

format:
  html:
    comments:
      hypothesis: true
  docx: default
  jats: default

  # (other formats)
  # pdf: default

execute:
  freeze: true

editor: visual

crossref:
  custom:
    - kind: float
      key: tbla
      reference-prefix: "Tabelle A"
      caption-prefix: "Tabelle A"
      latex-env: tbla
    - kind: float
      key: figb
      reference-prefix: "Abbildung B"
      caption-prefix: "Abbildung B"
      latex-env: figb
